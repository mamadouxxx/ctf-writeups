<!DOCTYPE html>
<html>
<head>
    <title>XSS Tower - {% block title %}{% endblock %}</title>
    <link rel="preload" href="{{ url_for('static', filename='css/style.css') }}" as="style">
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" as="style">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">
</head>
<body>
    <nav>
        <div class="nav-content">
            <a href="{{ url_for('index') }}" class="logo">XSS Tower</a>
            <div class="nav-links">
                <a href="{{ url_for('level1') }}">Level 1</a>
                <a href="{{ url_for('level2') }}">Level 2</a>
                <a href="{{ url_for('level3') }}">Level 3</a>
                <a href="{{ url_for('level4') }}">Level 4</a>
            </div>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>🎯 A Playground for XSS Vulnerabilities</p>
    </footer>
</body>
</html>
