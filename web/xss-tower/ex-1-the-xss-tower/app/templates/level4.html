<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Level 4: Server-Side XSS</title>
</head>
<body>
    <h1>Level 4: Server-Side XSS</h1>
    <form method="post">
        <input type="text" name="filename" placeholder="Enter filename">
        <button type="submit">Read File</button>
    </form>
    {% if content %}
    <h2>File Content:</h2>
    <pre>{{ content }}</pre>
    {% elif error %}
    <p>{{ error }}</p>
    {% endif %}
</body>
</html>
