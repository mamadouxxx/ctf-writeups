{% extends "base.html" %}

{% block title %}Level 3 - DOM-based XSS{% endblock %}

{% block content %}
<div class="challenge-container">
    <h2>Level 3: DOM-based XSS</h2>

    <form class="challenge-form" onsubmit="return false;">
        <input type="text" id="configInput" placeholder="Enter configuration...">
        <button onclick="processConfig()">Apply</button>
    </form>

    <div id="output" class="output-container"></div>
</div>

<script>
function processConfig() {
    try {
        var config = JSON.parse(document.getElementById('configInput').value);
        var imageUrl = config.config[4].url;
        var img = new Image();
        img.src = imageUrl;
        img.onload = function() {
            eval(config.config[4].event);
        };
        document.getElementById('output').textContent = '';
        document.getElementById('output').appendChild(img);
    } catch (e) {
        document.getElementById('output').innerText = e;
    }
}
</script>
{% endblock %}
