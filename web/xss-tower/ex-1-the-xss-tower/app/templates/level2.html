{% extends "base.html" %}

{% block title %}Level 2 - Stored XSS{% endblock %}

{% block content %}
<div class="challenge-container">
    <h2>Level 2: Stored XSS</h2>

    <form method="POST" class="challenge-form">
        <textarea name="comment" placeholder="Enter your comment..." rows="4"></textarea>
        <button type="submit">Post Comment</button>
    </form>

    <div class="comments-section">
        {% for comment in comments %}
        <div class="comment" text="{{ comment | safe }}">
            {{ comment }}
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
